<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS Meteo - Riservato</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; }
        
        /* Overlay del Form di Login */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            width: 300px;
        }

        .login-card h2 { margin-top: 0; color: #1e293b; font-size: 20px; }
        .login-card input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .login-card button {
            width: 100%;
            padding: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .login-card button:hover { background: #1d4ed8; }
        #error-msg { color: #dc2626; font-size: 12px; display: none; margin-top: 10px; }

        /* Stili Simbolo Meteo */
        .meteo-marker {
            position: absolute;
            width: 32px;
            height: 32px;
        }

        .wind-bar {
            position: absolute;
            width: 3px;
            height: 24px;
            background-color: #000;
            left: 14.5px;
            top: -4px;
            transform-origin: bottom center;
            z-index: 1;
        }

        .temp-circle {
            position: absolute;
            bottom: 0;
            left: 2px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #000;
            color: #fff;
            font-weight: bold;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .info-box { 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            background: rgba(255, 255, 255, 0.9); 
            padding: 10px 15px; 
            border-radius: 8px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.2); 
            z-index: 1000; 
            font-size: 12px; 
        }
    </style>
</head>
<body>

    <!-- Overlay di Login -->
    <div id="login-overlay">
        <div class="login-card">
            <h2>Area Riservata WebGIS</h2>
            <p style="font-size: 12px; color: #64748b;">Inserisci la password per accedere</p>
            <input type="password" id="password-input" placeholder="Password...">
            <button onclick="verificaPassword()">Accedi</button>
            <div id="error-msg">Password errata!</div>
        </div>
    </div>

    <!-- Mappa e Contenuto -->
    <div id="info" class="info-box">
        <strong>WebGIS Meteo</strong><br>
        <span id="last-update">Caricamento dati...</span>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        const HASH_CORRETTO = "81ef10c3be7ff8b0b9fa250691d47dabed8b22416e2bcd21bcdd4a1524d53f77";

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await window.crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function verificaPassword() {
            const errorDiv = document.getElementById('error-msg');
            errorDiv.style.display = 'none';
            
            try {
                const inserita = document.getElementById('password-input').value;
                const hashInserito = await sha256(inserita);
                
                if (hashInserito === HASH_CORRETTO) {
                    document.getElementById('login-overlay').style.display = 'none';
                    inizializzaMappa();
                } else {
                    errorDiv.innerText = "Password errata!";
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                console.error("Errore crittografico:", err);
                errorDiv.innerText = "Errore di sistema nel login.";
                errorDiv.style.display = 'block';
            }
        }

        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') verificaPassword();
        });

        function inizializzaMappa() {
            const map = L.map('map').setView([40.63, 17.94], 11);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);

            function getTempColor(temp) {
                if (temp < 0) return "#7c3aed";      // < 0°C: Viola
                if (temp < 3) return "#1e3a8a";       // 0°C - 3°C: Blu scuro
                if (temp < 10) return "#0284c7";      // 3°C - 10°C: Azzurro
                if (temp < 15) return "#16a34a";      // 10°C - 15°C: Verde
                if (temp < 20) return "#eab308";      // 15°C - 20°C: Giallo
                if (temp < 25) return "#f97316";      // 20°C - 25°C: Arancione
                if (temp < 30) return "#dc2626";      // 25°C - 30°C: Rosso
                if (temp < 35) return "#991b1b";      // 30°C - 35°C: Rosso scuro
                return "#581c87";                     // >= 35°C: Viola
            }

            let geojsonLayer;

            function loadMeteoData() {
                fetch('data/meteo_latest.json?t=' + new Date().getTime())
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('last-update').innerText = 'Ultimo agg: ' + (data.updated_at || 'N/D');

                        if (geojsonLayer) map.removeLayer(geojsonLayer);

                        geojsonLayer = L.geoJSON(data, {
                            pointToLayer: function (feature, latlng) {
                                const props = feature.properties;
                                const color = getTempColor(props.temp);
                                const windDir = props.wind_dir || 0;
                                const tempVal = props.temp.toFixed(1);

                                const customIcon = L.divIcon({
                                    className: 'meteo-marker',
                                    html: `
                                        <div class="wind-bar" style="transform: rotate(${windDir}deg);"></div>
                                        <div class="temp-circle" style="background-color: ${color};">${tempVal}</div>
                                    `,
                                    iconSize: [32, 32],
                                    iconAnchor: [16, 18],
                                    popupAnchor: [0, -18]
                                });

                                const marker = L.marker(latlng, { icon: customIcon });

                                marker.bindPopup(`
                                    <div style="font-size: 13px; line-height: 1.4;">
                                        <strong>Stazione:</strong> ${props.station_id} (${props.neighborhood || 'N/D'})<br>
                                        <strong>Ora:</strong> ${props.time || 'N/D'}<br>
                                        <hr style="margin: 5px 0; border: none; border-top: 1px solid #cbd5e1;">
                                        <strong>Temperatura:</strong> ${props.temp !== undefined ? props.temp.toFixed(1) + ' °C' : 'N/D'}<br>
                                        <strong>Punto di Rugiada:</strong> ${props.dewpoint !== undefined ? props.dewpoint + ' °C' : 'N/D'}<br>
                                        <strong>Umidità:</strong> ${props.humidity !== undefined ? props.humidity + '%' : 'N/D'}<br>
                                        <strong>Pressione:</strong> ${props.pressure !== undefined ? props.pressure + ' hPa' : 'N/D'}<br>
                                        <strong>Vento:</strong> ${props.wind_speed !== undefined ? props.wind_speed + ' km/h' : 'N/D'} (Dir: ${props.wind_dir !== undefined ? props.wind_dir + '°' : 'N/D'})<br>
                                        <strong>Raffica:</strong> ${props.wind_gust !== undefined ? props.wind_gust + ' km/h' : 'N/D'}<br>
                                        <strong>Pioggia (Rate):</strong> ${props.precip_rate !== undefined ? props.precip_rate + ' mm/h' : 'N/D'}<br>
                                        <strong>Pioggia (Totale):</strong> ${props.precip_total !== undefined ? props.precip_total + ' mm' : 'N/D'}<br>
                                        <strong>Radiazione Solare:</strong> ${props.solar_radiation !== undefined ? props.solar_radiation + ' W/m²' : 'N/D'}<br>
                                        <strong>Indice UV:</strong> ${props.uv !== undefined ? props.uv : 'N/D'}
                                    </div>
                                `);

                                return marker;
                            }
                        }).addTo(map);
                    })
                    .catch(err => console.error("Errore caricamento dati:", err));
            }

            loadMeteoData();
            setInterval(loadMeteoData, 60000);
        }
    </script>
</body>
</html>
