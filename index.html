<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS Meteo - Brindisi</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; }

        .meteo-marker {
            position: absolute;
            width: 32px;
            height: 32px;
        }
        .wind-bar {
            position: absolute;
            width: 3px;
            height: 24px;
            background-color: #000;
            left: 14.5px;
            top: -4px;
            transform-origin: bottom center;
            z-index: 1;
        }
        .temp-circle {
            position: absolute;
            bottom: 0;
            left: 2px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #000;
            color: #fff;
            font-weight: bold;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .humidity-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #0284c7;
            background-color: rgba(2, 132, 199, 0.85);
            color: #fff;
            font-weight: bold;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .precip-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #1d4ed8;
            background-color: rgba(29, 78, 216, 0.85);
            color: #fff;
            font-weight: bold;
            font-size: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .info-box { 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            background: rgba(255, 255, 255, 0.9); 
            padding: 10px 15px; 
            border-radius: 8px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.2); 
            z-index: 1000; 
            font-size: 12px; 
        }
        
        .info-box input[type="date"] {
            margin-top: 5px;
            padding: 3px 5px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="info" class="info-box">
        <strong>WebGIS Meteo</strong><br>
        <span id="last-update">Caricamento dati...</span><br>
        <label for="archive-date" style="font-size: 11px; color: #475569; display:block; margin-top:5px;">Seleziona Data:</label>
        <input type="date" id="archive-date">
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        function inizializzaMappa() {
            const map = L.map('map').setView([40.63, 17.94], 11);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);

            function getTempColor(temp) {
                if (temp < 0) return "#7c3aed";
                if (temp < 3) return "#1e3a8a";
                if (temp < 10) return "#0284c7";
                if (temp < 15) return "#16a34a";
                if (temp < 20) return "#eab308";
                if (temp < 25) return "#f97316";
                if (temp < 30) return "#dc2626";
                if (temp < 35) return "#991b1b";
                return "#581c87";
            }

            const layerTempVento = L.layerGroup().addTo(map);
            const layerUmidita = L.layerGroup();
            const layerPrecipitazioni = L.layerGroup();
            const layerRasterPrecipitazioni = L.layerGroup();
            const layerRasterTemperatura = L.layerGroup();

            const overlayMaps = {
                "🌡️ Temperatura & Vento": layerTempVento,
                "💧 Umidità": layerUmidita,
                "🌧️ Precipitazioni (Puntuali)": layerPrecipitazioni,
                "🗺️ Precipitazioni (Raster)": layerRasterPrecipitazioni,
                "🗺️ Temperatura (Raster)": layerRasterTemperatura
            };
            L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);

            function loadMeteoData(urlFile, isArchive = false) {
                fetch(urlFile + '?t=' + new Date().getTime())
                    .then(response => {
                        if (!response.ok) throw new Error("File non trovato");
                        return response.json();
                    })
                    .then(data => {
                        if (isArchive) {
                            document.getElementById('last-update').innerText = 'Archivio: ' + (document.getElementById('archive-date').value || 'Selezionato');
                        } else {
                            document.getElementById('last-update').innerText = 'Ultimo agg: ' + (data.updated_at || 'N/D');
                        }

                        layerTempVento.clearLayers();
                        layerUmidita.clearLayers();
                        layerPrecipitazioni.clearLayers();

                        const features = data.features || [];
                        features.forEach(feature => {
                            const props = feature.properties;
                            const coords = feature.geometry.coordinates;
                            const latlng = [coords[1], coords[0]];

                            const tempValNum = (props.temp !== null && props.temp !== undefined) ? Number(props.temp) : null;
                            const tempVal = tempValNum !== null ? tempValNum.toFixed(1) : 'N/D';
                            const tempColor = tempValNum !== null ? getTempColor(tempValNum) : '#555';
                            
                            const windDir = (props.wind_dir !== null && props.wind_dir !== undefined) ? props.wind_dir : 0;
                            const humVal = (props.humidity !== null && props.humidity !== undefined) ? props.humidity + '%' : 'N/D';
                            
                            const precipValNum = (props.precip_rate !== null && props.precip_rate !== undefined) ? Number(props.precip_rate) : 0;
                            const precipVal = precipValNum > 0 ? precipValNum.toFixed(1) + 'mm' : '0mm';

                            // 1. Marker Temperatura & Vento
                            const iconTempVento = L.divIcon({
                                className: 'meteo-marker',
                                html: `
                                    <div class="wind-bar" style="transform: rotate(${windDir}deg);"></div>
                                    <div class="temp-circle" style="background-color: ${tempColor};">${tempVal}</div>
                                `,
                                iconSize: [32, 32],
                                iconAnchor: [16, 18],
                                popupAnchor: [0, -18]
                            });

                            const markerTV = L.marker(latlng, { icon: iconTempVento });
                            aggiungiPopup(markerTV, props);
                            layerTempVento.addLayer(markerTV);

                            // 2. Marker Umidità
                            const iconUmidita = L.divIcon({
                                className: 'meteo-marker',
                                html: `<div class="humidity-circle">${humVal}</div>`,
                                iconSize: [30, 30],
                                iconAnchor: [15, 15],
                                popupAnchor: [0, -15]
                            });

                            const markerHum = L.marker(latlng, { icon: iconUmidita });
                            aggiungiPopup(markerHum, props);
                            layerUmidita.addLayer(markerHum);

                            // 3. Marker Precipitazioni Puntuali
                            const iconPrecipitazioni = L.divIcon({
                                className: 'meteo-marker',
                                html: `<div class="precip-circle">${precipVal}</div>`,
                                iconSize: [30, 30],
                                iconAnchor: [15, 15],
                                popupAnchor: [0, -15]
                            });

                            const markerPrecip = L.marker(latlng, { icon: iconPrecipitazioni });
                            aggiungiPopup(markerPrecip, props);
                            layerPrecipitazioni.addLayer(markerPrecip);
                        });
                    })
                    .catch(err => {
                        console.error("Errore caricamento dati:", err);
                        alert("Nessun dato d'archivio disponibile per la data selezionata.");
                    });
            }

            function loadRasterOverlays() {
                fetch('data/raster/raster_bounds.json?t=' + new Date().getTime())
                    .then(response => response.json())
                    .then(boundsData => {
                        const imageBounds = boundsData.bounds;
                        
                        // Raster Precipitazioni
                        layerRasterPrecipitazioni.clearLayers();
                        const precipUrl = 'data/raster/precip_raster.png?t=' + new Date().getTime();
                        const precipOverlay = L.imageOverlay(precipUrl, imageBounds, { opacity: 0.65 });
                        layerRasterPrecipitazioni.addLayer(precipOverlay);

                        // Raster Temperatura
                        layerRasterTemperatura.clearLayers();
                        const tempUrl = 'data/raster/temp_raster.png?t=' + new Date().getTime();
                        const tempOverlay = L.imageOverlay(tempUrl, imageBounds, { opacity: 0.65 });
                        layerRasterTemperatura.addLayer(tempOverlay);
                    })
                    .catch(err => console.log("Raster non ancora disponibili."));
            }

            function aggiungiPopup(marker, props) {
                marker.bindPopup(`
                    <div style="font-size: 13px; line-height: 1.4;">
                        <strong>Stazione:</strong> ${props.station_id} (${props.neighborhood || 'N/D'})<br>
                        <strong>Ora:</strong> ${props.time || props.archived_at || 'N/D'}<br>
                        <hr style="margin: 5px 0; border: none; border-top: 1px solid #cbd5e1;">
                        <strong>Temperatura:</strong> ${props.temp !== undefined && props.temp !== null ? props.temp.toFixed(1) + ' °C' : 'N/D'}<br>
                        <strong>Punto di Rugiada:</strong> ${props.dewpoint !== undefined && props.dewpoint !== null ? props.dewpoint + ' °C' : 'N/D'}<br>
                        <strong>Umidità:</strong> ${props.humidity !== undefined && props.humidity !== null ? props.humidity + '%' : 'N/D'}<br>
                        <strong>Pressione:</strong> ${props.pressure !== undefined && props.pressure !== null ? props.pressure + ' hPa' : 'N/D'}<br>
                        <strong>Vento:</strong> ${props.wind_speed !== undefined && props.wind_speed !== null ? props.wind_speed + ' km/h' : 'N/D'} (Dir: ${props.wind_dir !== undefined && props.wind_dir !== null ? props.wind_dir + '°' : 'N/D'})<br>
                        <strong>Raffica:</strong> ${props.wind_gust !== undefined && props.wind_gust !== null ? props.wind_gust + ' km/h' : 'N/D'}<br>
                        <strong>Pioggia (Rate):</strong> ${props.precip_rate !== undefined && props.precip_rate !== null ? props.precip_rate + ' mm/h' : 'N/D'}<br>
                        <strong>Pioggia (Totale):</strong> ${props.precip_total !== undefined && props.precip_total !== null ? props.precip_total + ' mm' : 'N/D'}<br>
                        <strong>Radiazione Solare:</strong> ${props.solar_radiation !== undefined && props.solar_radiation !== null ? props.solar_radiation + ' W/m²' : 'N/D'}<br>
                        <strong>Indice UV:</strong> ${props.uv !== undefined && props.uv !== null ? props.uv : 'N/D'}
                    </div>
                `);
            }

            // Caricamento iniziale
            loadMeteoData('data/meteo_latest.json', false);
            loadRasterOverlays();

            // Gestione calendario
            document.getElementById('archive-date').addEventListener('change', (e) => {
                const selectedDate = e.target.value;
                if (selectedDate) {
                    const archiveUrl = `archive/meteo_archive_${selectedDate}.json`;
                    loadMeteoData(archiveUrl, true);
                }
            });

            // Aggiornamento periodico in tempo reale
            setInterval(() => {
                const dateVal = document.getElementById('archive-date').value;
                if (!dateVal) {
                    loadMeteoData('data/meteo_latest.json', false);
                    loadRasterOverlays();
                }
            }, 60000);
        }

        window.onload = inizializzaMappa;
    </script>
</body>
</html>
