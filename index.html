<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS Meteo - Brindisi</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; }

        /* Stile Marker Temperatura & Vento */
        .meteo-marker {
            position: absolute;
            width: 32px;
            height: 32px;
        }
        .wind-bar {
            position: absolute;
            width: 3px;
            height: 24px;
            background-color: #000;
            left: 14.5px;
            top: -4px;
            transform-origin: bottom center;
            z-index: 1;
        }
        .temp-circle {
            position: absolute;
            bottom: 0;
            left: 2px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #000;
            color: #fff;
            font-weight: bold;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Stile Marker Umidità */
        .humidity-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #0284c7;
            background-color: rgba(2, 132, 199, 0.85);
            color: #fff;
            font-weight: bold;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .info-box { 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            background: rgba(255, 255, 255, 0.9); 
            padding: 10px 15px; 
            border-radius: 8px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.2); 
            z-index: 1000; 
            font-size: 12px; 
        }
    </style>
</head>
<body>

    <div id="info" class="info-box">
        <strong>WebGIS Meteo</strong><br>
        <span id="last-update">Caricamento dati...</span>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        function inizializzaMappa() {
            const map = L.map('map').setView([40.63, 17.94], 11);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);

            function getTempColor(temp) {
                if (temp < 0) return "#7c3aed";
                if (temp < 3) return "#1e3a8a";
                if (temp < 10) return "#0284c7";
                if (temp < 15) return "#16a34a";
                if (temp < 20) return "#eab308";
                if (temp < 25) return "#f97316";
                if (temp < 30) return "#dc2626";
                if (temp < 35) return "#991b1b";
                return "#581c87";
            }

            // Inizializziamo i Layer Groups di Leaflet
            const layerTempVento = L.layerGroup().addTo(map); // Di default attivo
            const layerUmidita = L.layerGroup();

            // Creazione del widget di controllo dei layer in alto a destra
            const overlayMaps = {
                "🌡️ Temperatura & Vento": layerTempVento,
                "💧 Umidità": layerUmidita
            };
            L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);

            function loadMeteoData() {
                fetch('data/meteo_latest.json?t=' + new Date().getTime())
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('last-update').innerText = 'Ultimo agg: ' + (data.updated_at || 'N/D');

                        // Pulisci i layer esistenti prima di ricaricare i nuovi dati
                        layerTempVento.clearLayers();
                        layerUmidita.clearLayers();

                        data.features.forEach(feature => {
                            const props = feature.properties;
                            const coords = feature.geometry.coordinates;
                            const latlng = [coords[1], coords[0]];

                            // --- 1. CREAZIONE MARKER TEMPERATURA & VENTO ---
                            const tempVal = props.temp !== undefined ? props.temp.toFixed(1) : 'N/D';
                            const tempColor = props.temp !== undefined ? getTempColor(props.temp) : '#555';
                            const windDir = props.wind_dir || 0;

                            const iconTempVento = L.divIcon({
                                className: 'meteo-marker',
                                html: `
                                    <div class="wind-bar" style="transform: rotate(${windDir}deg);"></div>
                                    <div class="temp-circle" style="background-color: ${tempColor};">${tempVal}</div>
                                `,
                                iconSize: [32, 32],
                                iconAnchor: [16, 18],
                                popupAnchor: [0, -18]
                            });

                            const markerTV = L.marker(latlng, { icon: iconTempVento });
                            aggiungiPopup(markerTV, props);
                            layerTempVento.addLayer(markerTV);

                            // --- 2. CREAZIONE MARKER UMIDITÀ ---
                            const humVal = props.humidity !== undefined ? props.humidity + '%' : 'N/D';
                            const iconUmidita = L.divIcon({
                                className: 'meteo-marker',
                                html: `<div class="humidity-circle">${humVal}</div>`,
                                iconSize: [30, 30],
                                iconAnchor: [15, 15],
                                popupAnchor: [0, -15]
                            });

                            const markerHum = L.marker(latlng, { icon: iconUmidita });
                            aggiungiPopup(markerHum, props);
                            layerUmidita.addLayer(markerHum);
                        });
                    })
                    .catch(err => console.error("Errore caricamento dati:", err));
            }

            function aggiungiPopup(marker, props) {
                marker.bindPopup(`
                    <div style="font-size: 13px; line-height: 1.4;">
                        <strong>Stazione:</strong> ${props.station_id} (${props.neighborhood || 'N/D'})<br>
                        <strong>Ora:</strong> ${props.time || 'N/D'}<br>
                        <hr style="margin: 5px 0; border: none; border-top: 1px solid #cbd5e1;">
                        <strong>Temperatura:</strong> ${props.temp !== undefined ? props.temp.toFixed(1) + ' °C' : 'N/D'}<br>
                        <strong>Punto di Rugiada:</strong> ${props.dewpoint !== undefined ? props.dewpoint + ' °C' : 'N/D'}<br>
                        <strong>Umidità:</strong> ${props.humidity !== undefined ? props.humidity + '%' : 'N/D'}<br>
                        <strong>Pressione:</strong> ${props.pressure !== undefined ? props.pressure + ' hPa' : 'N/D'}<br>
                        <strong>Vento:</strong> ${props.wind_speed !== undefined ? props.wind_speed + ' km/h' : 'N/D'} (Dir: ${props.wind_dir !== undefined ? props.wind_dir + '°' : 'N/D'})<br>
                        <strong>Raffica:</strong> ${props.wind_gust !== undefined ? props.wind_gust + ' km/h' : 'N/D'}<br>
                        <strong>Pioggia (Rate):</strong> ${props.precip_rate !== undefined ? props.precip_rate + ' mm/h' : 'N/D'}<br>
                        <strong>Pioggia (Totale):</strong> ${props.precip_total !== undefined ? props.precip_total + ' mm' : 'N/D'}<br>
                        <strong>Radiazione Solare:</strong> ${props.solar_radiation !== undefined ? props.solar_radiation + ' W/m²' : 'N/D'}<br>
                        <strong>Indice UV:</strong> ${props.uv !== undefined ? props.uv : 'N/D'}
                    </div>
                `);
            }

            loadMeteoData();
            setInterval(loadMeteoData, 60000);
        }

        window.onload = inizializzaMappa;
    </script>
</body>
</html>
