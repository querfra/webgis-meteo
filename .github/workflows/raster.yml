name: Genera Raster Meteo

on:
  schedule:
    - cron: '*/10 * * * *'  # Esegue ogni 10 minuti
  workflow_dispatch:

jobs:
  generate-raster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze scientifiche
        run: pip install numpy scipy matplotlib requests

      - name: Esegui interpolazione raster
        run: python script_raster.py

      - name: Commit e push raster
        run: |
          git config --global user.name "GitHub Actions Raster Bot"
          git config --global user.email "actions@github.com"
          git add data/raster/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento automatico raster meteo" && git push)
