name: Aggiornamento Meteo WebGIS

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Scarica dati meteo
        run: python script_download.py

      - name: Configura utente Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Salva e pubblica i dati aggiornati
        run: |
          git add data/meteo_latest.json
          git diff --staged --quiet || git commit -m "Auto-update dati meteo"
          git push
