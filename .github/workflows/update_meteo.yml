name: Aggiornamento Meteo Completo

on:
  schedule:
    - cron: '*/10 * * * *'  # Esegue l'intero processo ogni 10 minuti
  workflow_dispatch: # Permette l'avvio manuale

jobs:
  update-meteo-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: pip install requests numpy scipy matplotlib

      - name: 1. Scarica dati meteo e genera summary
        run: python script_download.py

      - name: 2. Genera raster temperatura e precipitazioni
        run: python script_raster.py

      - name: 3. Sincronizza, committa e spingi tutto su GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git pull origin main --rebase
          git add data/meteo_latest.json data/summary/ data/raster/ archive/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento automatico completo: meteo, summary, raster e archivio" && git push)
